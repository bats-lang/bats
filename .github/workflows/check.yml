name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ATS2
        run: |
          curl -sL "https://raw.githubusercontent.com/ats-lang/ats-lang.github.io/master/FROZEN000/ATS-Postiats/ATS2-Postiats-int-0.4.2.tgz" -o /tmp/ats2.tgz
          mkdir -p ~/.ats2
          tar -xzf /tmp/ats2.tgz -C ~/.ats2
          cd ~/.ats2/ATS2-Postiats-int-0.4.2
          make -j$(nproc) -C src/CBOOT patsopt
          mkdir -p bin
          cp src/CBOOT/patsopt bin/patsopt
          mkdir -p ~/.bats
          ln -sf ~/.ats2/ATS2-Postiats-int-0.4.2 ~/.bats/ats2

      - name: Build seed compiler from bootstrap/c
        run: |
          cp -R bootstrap/c ~/seed
          make -j$(nproc) -C ~/seed PATSHOME=$HOME/.ats2/ATS2-Postiats-int-0.4.2 debug/bats
          mkdir -p ~/bats-bin
          cp ~/seed/debug/bats ~/bats-bin/bats

      - name: Fetch deps from lock
        run: |
          git clone https://github.com/bats-lang/repository-prototype.git ~/repository
          mkdir -p bats_modules
          awk '!seen[$1]++ { print $1, $2 }' bats.lock | while read name version; do
            dir="bats_modules/$name"
            mkdir -p "$dir"
            unzip -o ~/repository/"$name"/"${name}_${version}.bats" -d "$dir"
          done

      - name: bats check
        run: |
          export PATH=~/bats-bin:$PATH
          bats check --repository ~/repository

      - name: bats build
        run: |
          export PATH=~/bats-bin:$PATH
          bats build --repository ~/repository

      - name: Test lock resolves namespaced transitive deps
        run: tests/lock-namespace/check.sh dist/debug/bats ~/repository

      - name: Test check exits non-zero on type errors
        run: tests/check-fails/check.sh dist/debug/bats

      - name: Verify bootstrap/c matches sources
        run: |
          scripts/bootstrap-c.sh dist/debug/bats ~/repository /tmp/regen
          if ! diff -r bootstrap/c /tmp/regen > /tmp/bootstrap.diff; then
            head -50 /tmp/bootstrap.diff
            echo "::error::bootstrap/c is stale. Run: scripts/bootstrap-c.sh dist/debug/bats <repository> and commit bootstrap/c"
            exit 1
          fi

      - name: Verify fixpoint (compiler built by itself emits the same C)
        run: |
          mkdir -p ~/stage2
          cp dist/debug/bats ~/stage2/bats
          rm -rf build dist
          ~/stage2/bats build --repository ~/repository
          scripts/bootstrap-c.sh dist/debug/bats ~/repository /tmp/regen2
          diff -r bootstrap/c /tmp/regen2
