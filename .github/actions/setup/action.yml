name: Set up bats
description: >-
  What every job of a bats repository needs first: libgmp-dev and lld, the
  compiler built from the checked-in bootstrap C of one pinned commit (which
  needs no ATS2), then, by bats itself, the GMP build of ATS2 (bats ats2
  install), the package repository at its pinned commit (bats
  clone-repository), the patsopt caps, and BATS_COMMIT (bats record-commit),
  so the version a build is stamped with is the commit's. Linux runners with apt, on the pinned image ubuntu-24.04, a label that does not move (bridge#154). Called by commit:
  bats-lang/bats/.github/actions/setup@<40 hex digits>. The step installs;
  it keys no cache (a build/ is kept or dropped by bats itself, bats#267).

inputs:
  working-directory:
    description: >-
      The project's directory, where the pin files are read and bats.lock is
      looked for. A checkout must already be there.
    default: .
  bats-version:
    description: >-
      The commit of bats-lang/bats the compiler is built from (40 lowercase
      hex digits). Empty reads the file bats-version-file.
    default: ''
  bats-version-file:
    description: The pin file read when bats-version is empty (one commit).
    default: .github/bats-version
  repository-version:
    description: >-
      The commit of bats-lang/repository-prototype the packages are fetched
      from (40 lowercase hex digits). Empty reads repository-version-file.
    default: ''
  repository-version-file:
    description: The pin file read when repository-version is empty.
    default: .github/repository-version
  commit:
    description: >-
      The commit the version names (bats writes its date and short SHA as
      the facts a build is stamped with, from BATS_COMMIT): a pull request's
      own head, not the merge GitHub tests, and a merge group's own commit.
      The head is the merge's second parent, so the checkout must be two
      commits deep (fetch-depth: 2) or the commit must be fetched.
    default: ${{ github.event.pull_request.head.sha || github.sha }}
  profile:
    description: >-
      Which build of the compiler to install: release (-O2, bats's own work
      takes half the time) or debug.
    default: release
  require-lock:
    description: >-
      Fail when the project has no bats.lock ("true"). A package with no
      dependencies has none: "false".
    default: 'true'
  patsopt-timeout-s:
    description: >-
      BATS_PATSOPT_TIMEOUT_S: seconds one patsopt run may take (the GMP
      build's solver can run away on a proof the other answers at once).
    default: '600'
  patsopt-mem-mb:
    description: "BATS_PATSOPT_MEM_MB: megabytes of address space one patsopt run may use."
    default: '4096'

outputs:
  bats-version:
    description: The commit the compiler was built from.
    value: ${{ steps.pins.outputs.bats }}
  repository-version:
    description: The commit of the package repository cloned.
    value: ${{ steps.pins.outputs.repository }}
  repository:
    description: The directory of the package repository (also BATS_REPOSITORY).
    value: ${{ steps.pins.outputs.repository_dir }}
  commit:
    description: The commit BATS_COMMIT names.
    value: ${{ steps.pins.outputs.commit }}

runs:
  using: composite
  steps:
    # Everything that can be wrong with the inputs is said first, before
    # anything is installed. Inputs reach the shell as environment
    # variables, never spliced into the script.
    - name: Read the pins
      id: pins
      shell: bash
      env:
        WORKDIR: ${{ inputs.working-directory }}
        BATS_PIN: ${{ inputs.bats-version }}
        BATS_PIN_FILE: ${{ inputs.bats-version-file }}
        REPOSITORY_PIN: ${{ inputs.repository-version }}
        REPOSITORY_PIN_FILE: ${{ inputs.repository-version-file }}
        COMMIT: ${{ inputs.commit }}
        PROFILE: ${{ inputs.profile }}
        REQUIRE_LOCK: ${{ inputs.require-lock }}
        TIMEOUT_S: ${{ inputs.patsopt-timeout-s }}
        MEM_MB: ${{ inputs.patsopt-mem-mb }}
      run: |
        set -eu
        fail() { echo "::error::setup-bats: $1"; exit 1; }
        cd "$WORKDIR" || fail "working-directory $WORKDIR does not exist"
        pin() { # <name> <given> <file> -> pinned, a full lowercase SHA (not in a subshell: fail must reach the log)
          value=$2
          if [ -z "$value" ]; then
            [ -f "$3" ] || fail "$1 is not given and $3 does not exist: pin it (a full commit SHA), CI is pinned"
            value=$(tr -d '[:space:]' < "$3")
          fi
          case $value in
            *[!0-9a-f]*|'') fail "$1 is '$value': it must be a full commit SHA (40 lowercase hex digits), never a branch or a tag" ;;
          esac
          [ ${#value} -eq 40 ] || fail "$1 is '$value': it must be a full commit SHA (40 lowercase hex digits)"
          pinned=$value
        }
        pin "bats-version" "$BATS_PIN" "$BATS_PIN_FILE"
        bats_commit=$pinned
        pin "repository-version" "$REPOSITORY_PIN" "$REPOSITORY_PIN_FILE"
        repository_commit=$pinned
        case $PROFILE in release|debug) ;; *) fail "profile is '$PROFILE': release or debug" ;; esac
        case $TIMEOUT_S in *[!0-9]*|'') fail "patsopt-timeout-s is '$TIMEOUT_S': whole seconds" ;; esac
        case $MEM_MB in *[!0-9]*|'') fail "patsopt-mem-mb is '$MEM_MB': whole megabytes" ;; esac
        case $REQUIRE_LOCK in
          true) [ -f bats.lock ] || fail "bats.lock is missing: run 'bats lock --repository <dir>' and commit it" ;;
          false) ;;
          *) fail "require-lock is '$REQUIRE_LOCK': true or false" ;;
        esac
        {
          echo "bats=$bats_commit"
          echo "repository=$repository_commit"
          echo "repository_dir=$HOME/repository"
          echo "commit=$COMMIT"
        } >> "$GITHUB_OUTPUT"

    # libgmp and lld are the system's (bats does not install packages).
    # libgmp is what the GMP build of ATS2 is built and run with: its
    # constraint solver does infinite-precision arithmetic, where the -int
    # build computes in C int and accepts false statements (bats-lang/quire#594,
    # bats#261). A run that runs away is ended by the caps, naming its
    # module (bats#263)
    - name: Install libgmp-dev and lld, and set the patsopt caps
      shell: bash
      env:
        TIMEOUT_S: ${{ inputs.patsopt-timeout-s }}
        MEM_MB: ${{ inputs.patsopt-mem-mb }}
      run: |
        set -eu
        sudo apt-get install -y -q libgmp-dev lld
        echo "BATS_PATSOPT_TIMEOUT_S=$TIMEOUT_S" >> "$GITHUB_ENV"
        echo "BATS_PATSOPT_MEM_MB=$MEM_MB" >> "$GITHUB_ENV"

    # The compiler is built first, from the checked-in C of the pinned
    # commit (bootstrap/c), fetched by that commit, not by a name that can
    # move. The C carries the runtime header it is compiled with, so no
    # ATS2 is needed yet (bats#283); the commit must be one with that
    # change.
    - name: Build bats from the bootstrap C of the pinned commit
      shell: bash
      env:
        BATS_COMMIT_BUILT: ${{ steps.pins.outputs.bats }}
        PROFILE: ${{ inputs.profile }}
      run: |
        set -eu
        src="$RUNNER_TEMP/bats-src"
        rm -rf "$src"
        git init -q "$src"
        git -C "$src" fetch -q --depth 1 https://github.com/bats-lang/bats.git "$BATS_COMMIT_BUILT"
        git -C "$src" checkout -q FETCH_HEAD
        [ -f "$src/bootstrap/c/_bats_native_runtime.h" ] \
          || { echo "::error::setup-bats: bats-version $BATS_COMMIT_BUILT predates bats#283: its bootstrap/c has no _bats_native_runtime.h and needs an ATS2 to build. Pin a newer commit of bats-lang/bats"; exit 1; }
        rm -rf ~/bats-c
        cp -R "$src/bootstrap/c" ~/bats-c
        make -j"$(nproc)" -C ~/bats-c "$PROFILE/bats"
        mkdir -p ~/bats-bin
        cp ~/bats-c/"$PROFILE"/bats ~/bats-bin/bats
        rm -rf "$src"
        sudo cp ~/bats-bin/bats /bin/bats
        echo "$HOME/bats-bin" >> "$GITHUB_PATH"

    # Then bats does the rest: it installs the ATS2 it pins (checked against
    # its SHA-256, in ~/.bats/ats2), clones the package repository at the
    # project's pinned commit, and names the commit the version is the date
    # of. The packages are the versions the committed bats.lock locks (CI is
    # pinned): bats check and build fetch exactly those and fail on a lock
    # that does not match the project; only a relock moves them. What bats
    # prints as NAME=VALUE is the environment of the later steps.
    - name: Install ATS2 (patsopt)
      shell: bash
      run: bats ats2 install

    - name: Clone the package repository at its pinned commit
      shell: bash
      env:
        REPOSITORY_COMMIT: ${{ steps.pins.outputs.repository }}
        REPOSITORY_DIR: ${{ steps.pins.outputs.repository_dir }}
      run: |
        set -eu
        # a bats that does not know the command prints its usage and exits 0:
        # only a single NAME=VALUE line reaches the environment
        bats clone-repository "$REPOSITORY_COMMIT" --repository "$REPOSITORY_DIR" > "$RUNNER_TEMP/clone.env"
        awk 'NR == 1 && /^BATS_REPOSITORY=[^=]+$/ { ok = 1 } END { exit !(ok && NR == 1) }' "$RUNNER_TEMP/clone.env" \
          || { echo "::error::setup-bats: bats clone-repository did not print BATS_REPOSITORY=<dir>: is the bats built from a commit that has it (bats#283)?"; exit 1; }
        cat "$RUNNER_TEMP/clone.env" >> "$GITHUB_ENV"

    # The commit the version names (quire#219): bats writes the facts (the
    # commit's date and short SHA, bats#250) from BATS_COMMIT, for every
    # later step. A pull request's head is the merge's second parent, so the
    # commit is in the checkout only two commits deep (fetch-depth: 2)
    - name: Name the commit built from
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMIT: ${{ steps.pins.outputs.commit }}
      run: |
        set -eu
        bats record-commit "$COMMIT" > "$RUNNER_TEMP/commit.env"
        awk 'NR == 1 && /^BATS_COMMIT=[0-9a-f]+$/ && length($0) == 52 { ok = 1 } END { exit !(ok && NR == 1) }' "$RUNNER_TEMP/commit.env" \
          || { echo "::error::setup-bats: bats record-commit did not print BATS_COMMIT=<commit>: is the bats built from a commit that has it (bats#283)?"; exit 1; }
        cat "$RUNNER_TEMP/commit.env" >> "$GITHUB_ENV"
